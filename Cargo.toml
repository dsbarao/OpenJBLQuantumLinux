[package]
name = "janbalinux-soniccore"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "JanBaLinux SonicCore — open-source gaming headset control and audio platform for Linux"

[[bin]]
name = "soniccore"
path = "src/main.rs"

[[bin]]
name = "soniccore-daemon"
path = "src/bin/soniccore-daemon.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
